<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 서재</title>
  <meta name="description" content="나만의 로맨스 독서 다이어리">
  <meta name="theme-color" content="#f7f6f4">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo" onclick="openLibName()">
    <span id="logoEmoji">📚</span>
    <span id="logoName"><em>나의 서재</em></span>
  </div>
  <div class="header-spacer"></div>
  <span class="book-chip" id="bookChip">0권의 이야기</span>
  <div class="header-icons">
    <button class="theme-btn" id="darkBtn" onclick="toggleDark()" title="다크 모드">🌙</button>
    <button class="settings-btn" onclick="openSettings()" title="테마/폰트">⚙</button>
    <button class="random-btn" onclick="openRandomBook()" title="랜덤 추천">🎲 랜덤</button>
    <button class="hbtn" onclick="openJsonMenu()">📥 백업</button>
    <button class="hbtn primary" onclick="openAdd()">+ 새 기록</button>
  </div>
  <div style="position:relative;display:none" id="moreWrap">
    <button class="hbtn" id="moreBtn" onclick="toggleMoreMenu()" style="display:none;font-size:18px;padding:7px 10px">⋯</button>
    <div class="more-menu" id="moreMenu">
      <button class="more-menu-item" onclick="toggleDark();closeMoreMenu()">🌙 다크 모드</button>
      <button class="more-menu-item" onclick="openSettings();closeMoreMenu()">⚙ 테마 / 폰트</button>
      <button class="more-menu-item" onclick="openRandomBook();closeMoreMenu()">🎲 랜덤 추천</button>
      <button class="more-menu-item" onclick="openJsonMenu();closeMoreMenu()">📥 백업 / 불러오기</button>
      <button class="more-menu-item" onclick="openAdd();closeMoreMenu()">+ 새 기록</button>
    </div>
  </div>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchPage('library',this)">서재</button>
  <button class="nav-tab" onclick="switchPage('stats',this)">통계</button>
  <button class="nav-tab" onclick="switchPage('calendar',this)">캘린더</button>
</div>

<div class="main">
  <!-- LIBRARY -->
  <div id="page-library" class="page active">
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="제목, 작가, 태그 검색…">
        </div>
        <button class="sp sp-on" data-sv="" onclick="setStatusFilter('')">전체</button>
        <button class="sp" data-sv="완독" onclick="setStatusFilter('완독')">완독</button>
        <button class="sp" data-sv="읽는중" onclick="setStatusFilter('읽는중')">읽는중</button>
        <button class="sp" data-sv="읽고싶어요" onclick="setStatusFilter('읽고싶어요')">읽고싶어요</button>
        <button class="fav-pill" id="favPill" onclick="toggleFavFilter()">⭐ 즐겨찾기</button>
        <select class="sort-select" id="sortSelect" onchange="render()">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="title">제목순</option>
          <option value="author">작가순</option>
          <option value="rating">별점순</option>
          <option value="custom">사용자 지정</option>
        </select>
      </div>
    </div>
    <div class="grid" id="bookGrid"></div>
  </div>

  <!-- STATS -->
  <div id="page-stats" class="page">
    <div class="stats-tabs">
      <button class="stats-tab active" onclick="switchStatsTab('overview',this)">📊 개요</button>
      <button class="stats-tab" onclick="switchStatsTab('chart',this)">📈 차트</button>
      <button class="stats-tab" onclick="switchStatsTab('tags',this)">🏷️ 태그</button>
      <button class="stats-tab" onclick="switchStatsTab('char',this)">💙 캐릭터</button>
      <button class="stats-tab" onclick="switchStatsTab('mood',this)">💭 감정</button>
    </div>
    <div id="statsContent"></div>
  </div>

  <!-- CALENDAR -->
  <div id="page-calendar" class="page">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrevMonth()">◀</button>
      <span class="cal-nav-title" id="calNavTitle"></span>
      <button class="cal-nav-btn" onclick="calNextMonth()">▶</button>
      <button class="cal-nav-btn" onclick="calGoToday()" style="font-size:12px;padding:5px 10px">오늘</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-month-wrap">
        <div class="cal-days-header" id="calDaysHeader"></div>
        <div class="cal-days" id="calDays"></div>
      </div>
      <div class="cal-sidebar">
        <div class="goal-card">
          <div class="goal-header">
            <span class="goal-title">📚 독서 목표</span>
            <button class="goal-edit-btn" id="goalEditBtn" onclick="toggleGoalEdit()">수정</button>
          </div>
          <div class="goal-numbers">
            <span class="goal-done" id="goalDoneNum">0</span>
            <span class="goal-sep">/</span>
            <span class="goal-target" id="goalTargetNum">—</span>
            <span class="goal-unit">권</span>
          </div>
          <div class="goal-track"><div class="goal-bar" id="goalBar" style="width:0%"></div></div>
          <div class="goal-pct" id="goalPct">목표를 설정해보세요!</div>
          <div class="goal-msg" id="goalMsg"></div>
          <div id="goalEditRow" style="display:none">
            <div class="goal-set-wrap">
              <input type="number" class="goal-set-input" id="goalInput" min="1" max="999" placeholder="목표 권수">
              <button class="btn sm primary" onclick="saveGoal()">저장</button>
              <button class="btn sm danger" onclick="clearGoal()">초기화</button>
            </div>
          </div>
        </div>
        <div>
          <div class="cal-sidebar-title">📖 이 달의 완독</div>
          <div class="cal-books-list" id="calBooksList"></div>
        </div>
      </div>
    </div>
    <div class="cal-tooltip" id="calTooltip"></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="ov" id="editOv" onclick="ovClick(event,'editOv',closeEdit)">
  <div class="modal" style="max-width:840px;max-height:90vh">
    <div class="modal-head">
      <h2 id="editModalTitle">책 추가</h2>
      <button class="btn-x" onclick="closeEdit()">&times;</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-foot">
      <button class="btn danger sm" id="delBtn" style="display:none" onclick="deleteBook()">삭제</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="closeEdit()">취소</button>
      <button class="btn primary" onclick="saveBook()">저장</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="ov" id="detailOv" onclick="ovClick(event,'detailOv',closeDetail)">
  <div class="modal detail-modal">
    <div class="modal-head">
      <h2>기록 상세</h2>
      <button class="btn-x" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-scroll" id="detailScroll">
      <div class="detail-top" id="detailTop"></div>
      <div class="det-content" id="detailContent"></div>
    </div>
  </div>
</div>

<!-- JSON MODAL -->
<div class="ov" id="jsonOv" onclick="ovClick(event,'jsonOv',closeJsonMenu)">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h2>데이터 백업</h2>
      <button class="btn-x" onclick="closeJsonMenu()">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--txt2);margin-bottom:16px">JSON 파일로 내보내거나 불러올 수 있어요.</p>
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="btn primary" onclick="exportJSON()" style="width:100%">📤 내보내기 (다운로드)</button>
        <div class="fg">
          <label>가져오기</label>
          <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
        </div>
      </div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="sec-label" style="margin-bottom:8px">리디북스 자동 입력</div>
        <div class="cover-url-row">
          <input type="url" id="ridiUrlInput" placeholder="https://ridibooks.com/books/..." style="flex:1">
          <button class="cover-url-btn" id="ridiUrlBtn" onclick="fetchRidiBook()">불러오기</button>
        </div>
        <p style="font-size:11px;color:var(--txt4);margin-top:6px">리디북스 책 페이지 URL을 붙여넣으면 제목, 저자, 표지, 장르, 소재/관계 태그가 자동 입력돼요.</p>
      </div>
    </div>
  </div>
</div>

<!-- SHARE CARD MODAL -->
<div class="ov" id="shareOv" onclick="ovClick(event,'shareOv',closeShare)">
  <div class="modal" style="max-width:500px;max-height:90vh">
    <div class="modal-head">
      <h2>💌 추천 카드</h2>
      <button class="btn-x" onclick="closeShare()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="share-canvas-wrap"><canvas id="shareCanvas" width="720" height="960"></canvas></div>
      <div class="fg"><label>한 줄 메시지</label><input type="text" id="shareMsg" placeholder="이 책을 추천하는 이유…" oninput="drawCard(currentShareId)"></div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:center">
        <button class="btn sm" id="thm-cream" onclick="setShareTheme('cream')" style="font-weight:700">크림</button>
        <button class="btn sm" id="thm-navy" onclick="setShareTheme('navy')">네이비</button>
        <button class="btn sm" id="thm-rose" onclick="setShareTheme('rose')">로즈</button>
        <button class="btn sm" id="thm-dark" onclick="setShareTheme('dark')">다크</button>
      </div>
    </div>
    <div class="modal-foot">
      <div style="flex:1"></div>
      <button class="btn" onclick="closeShare()">닫기</button>
      <button class="btn primary" onclick="downloadCard()">💾 이미지 저장</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="ov" id="settingsOv" onclick="ovClick(event,'settingsOv',closeSettings)">
  <div class="modal" style="max-width:520px;max-height:90vh">
    <div class="modal-head">
      <h2>⚙ 테마 / 폰트</h2>
      <button class="btn-x" onclick="closeSettings()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="sec-label">배경 테마</div>
      <div class="theme-grid" id="themeGrid"></div>
      <div class="sec-label" style="margin-top:20px">본문 폰트</div>
      <div class="font-list" id="fontList"></div>
      <div style="margin-top:12px">
        <label class="font-upload-area">
          <div style="font-size:20px;opacity:.4">📁</div>
          <p>커스텀 폰트 업로드 (.ttf, .otf, .woff, .woff2)</p>
          <input type="file" accept=".ttf,.otf,.woff,.woff2" multiple onchange="handleFontUpload(event)" style="display:none">
        </label>
      </div>
    </div>
  </div>
</div>

<!-- HELP MODAL -->
<div class="ov" id="helpOv" onclick="ovClick(event,'helpOv',closeHelp)">
  <div class="modal" style="max-width:560px;max-height:85vh">
    <div class="modal-head">
      <h2>📖 도움말</h2>
      <button class="btn-x" onclick="closeHelp()">&times;</button>
    </div>
    <div class="modal-body" id="helpContent"></div>
  </div>
</div>

<!-- LIB NAME MODAL -->
<div class="ov" id="libNameOv" onclick="ovClick(event,'libNameOv',closeLibName)">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h2>서재 이름 변경</h2>
      <button class="btn-x" onclick="closeLibName()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="fg" style="margin-bottom:12px">
        <label>서재 이름</label>
        <input type="text" id="libNameInput" placeholder="나의 서재">
      </div>
      <div class="fg" style="margin-bottom:14px">
        <label>이모지</label>
        <div id="emojiGrid" style="display:flex;flex-wrap:wrap;gap:4px"></div>
      </div>
      <div style="text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
        <span id="libNamePreviewEmoji" style="font-size:28px">📚</span>
        <span id="libNamePreviewText" style="font-family:var(--font-display);font-size:20px;margin-left:8px">나의 서재</span>
      </div>
    </div>
    <div class="modal-foot">
      <div style="flex:1"></div>
      <button class="btn" onclick="closeLibName()">취소</button>
      <button class="btn primary" onclick="saveLibName()">저장</button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="ov" id="confirmOv">
  <div class="modal" style="max-width:400px">
    <div class="modal-body" style="text-align:center;padding:28px 24px">
      <h3 id="confirmTitle" style="font-family:var(--font-display);font-size:17px;margin-bottom:8px">확인</h3>
      <p id="confirmMsg" style="font-size:13px;color:var(--txt2);margin-bottom:20px;line-height:1.6"></p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="confirmCancel()">취소</button>
        <button class="btn primary" id="confirmOkBtn" onclick="confirmOk()">확인</button>
      </div>
    </div>
  </div>
</div>

<!-- IMPORT CHOICE MODAL -->
<div class="ov" id="importChoiceOv">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h2>가져오기 방식</h2>
      <button class="btn-x" onclick="cancelImportChoice()">&times;</button>
    </div>
    <div class="modal-body" style="text-align:center">
      <p id="importChoiceInfo" style="font-size:13px;color:var(--txt2);margin-bottom:16px"></p>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn primary" onclick="confirmImportChoice('overwrite')">🔄 덮어쓰기 (기존 데이터 삭제)</button>
        <button class="btn" onclick="confirmImportChoice('merge')">➕ 병합 (중복 건너뜀)</button>
        <button class="btn" onclick="cancelImportChoice()">취소</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
<script src="js/library.js"></script>
<script src="js/stats.js"></script>
<script src="js/calendar.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
