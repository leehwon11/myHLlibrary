<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 서재</title>
  <meta name="description" content="나만의 로맨스 독서 다이어리">
  <meta name="theme-color" content="#C4A882">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="notebook">
  <div class="notebook-edge"></div>
  <div class="spine"></div>

  <nav class="side-tabs">
    <button class="side-tab tab-library active" data-page="library">서재</button>
    <button class="side-tab tab-stats" data-page="stats">통계</button>
    <button class="side-tab tab-calendar" data-page="calendar">캘린더</button>
  </nav>

  <header class="notebook-header">
    <h1 class="nb-title">나의 서재</h1>
    <span class="nb-count" id="bookCount">0권의 이야기</span>
    <div class="nb-actions">
      <button class="nb-btn theme-btn" id="themeToggle" title="테마 전환">🌙</button>
      <button class="nb-btn" id="settingsBtn" title="설정">설정</button>
      <button class="nb-btn" id="exportImportBtn" title="내보내기/가져오기">백업</button>
      <button class="nb-btn" id="ridiImportBtn" title="리디북스에서 가져오기">리디</button>
      <button class="nb-btn" id="randomBookBtn" title="랜덤 추천">🎲</button>
      <button class="nb-btn primary" id="addBookBtn">+ 새 기록</button>
    </div>
  </header>

  <div class="page-content">
    <!-- Library Page -->
    <div id="page-library" class="page active">
      <div class="toolbar">
        <input type="text" class="search-note" id="searchInput" placeholder="제목, 작가 검색...">
        <button class="filter-pill active" data-filter="all">전체</button>
        <button class="filter-pill" data-filter="완독">완독</button>
        <button class="filter-pill" data-filter="읽는중">읽는중</button>
        <button class="filter-pill" data-filter="읽고싶어요">읽고싶어요</button>
        <button class="filter-pill" data-filter="fav">♥</button>
        <div class="sort-wrap">
          <select class="sort-select" id="sortSelect">
            <option value="newest">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="title">제목순</option>
            <option value="rating">별점순</option>
          </select>
        </div>
      </div>
      <div id="bookGrid"></div>
    </div>

    <!-- Stats Page -->
    <div id="page-stats" class="page">
      <div id="statsContainer"></div>
    </div>

    <!-- Calendar Page -->
    <div id="page-calendar" class="page">
      <div id="calendarContainer"></div>
    </div>
  </div>
</div>

<!-- Edit/Add Modal -->
<div class="ov" id="ov-edit">
  <div class="modal modal-lg">
    <div class="modal-head">
      <h2 id="editModalTitle">새 기록</h2>
      <button class="btn-x">&times;</button>
    </div>
    <div class="modal-body" id="editModalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="editDelete" hidden>삭제</button>
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal('ov-edit')">취소</button>
      <button class="btn btn-primary" id="editSave">저장</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="ov" id="ov-detail">
  <div class="modal modal-md">
    <div class="modal-head">
      <h2>기록 상세</h2>
      <button class="btn-x">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="detailDelete">삭제</button>
      <div class="spacer"></div>
      <button class="btn" id="detailEdit">수정</button>
      <button class="btn" onclick="closeModal('ov-detail')">닫기</button>
    </div>
  </div>
</div>

<!-- Ridi Import Modal -->
<div class="ov" id="ov-ridi">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2>리디북스 가져오기</h2>
      <button class="btn-x">&times;</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label>리디북스 URL</label>
        <input type="url" id="ridiUrl" placeholder="https://ridibooks.com/books/...">
      </div>
      <p style="font-size:12px;color:var(--ink-muted);margin-top:8px;">리디북스 책 페이지의 URL을 붙여넣으면 자동으로 정보를 불러옵니다.</p>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal('ov-ridi')">취소</button>
      <button class="btn btn-primary" id="ridiSubmit">불러오기</button>
    </div>
  </div>
</div>

<!-- Export/Import Modal -->
<div class="ov" id="ov-export">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2>데이터 백업</h2>
      <button class="btn-x">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-family:var(--font-hand);font-size:18px;margin-bottom:16px;">JSON 파일로 내보내거나 불러올 수 있어요.</p>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <button class="btn btn-primary" id="exportBtn" style="width:100%;">내보내기 (다운로드)</button>
        <div class="fg">
          <label>가져오기</label>
          <input type="file" id="importFileInput" accept=".json">
        </div>
        <button class="btn" id="importBtn" style="width:100%;">파일 불러오기</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="ov" id="ov-settings">
  <div class="modal modal-sm">
    <div class="modal-head">
      <h2>설정</h2>
      <button class="btn-x">&times;</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label>서재 이름</label>
        <input type="text" id="settingsName" placeholder="나의 서재">
      </div>
      <div class="fg" style="margin-top:12px;">
        <label>연간 독서 목표</label>
        <input type="number" id="settingsGoal" min="1" max="999" placeholder="30">
      </div>
    </div>
    <div class="modal-foot">
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal('ov-settings')">취소</button>
      <button class="btn btn-primary" id="settingsSave">저장</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="ov" id="ov-confirm">
  <div class="modal modal-sm">
    <div class="modal-body" style="text-align:center;padding:32px 24px;">
      <p id="confirmMsg" style="font-family:var(--font-hand);font-size:20px;margin-bottom:20px;"></p>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn" id="confirmNo">아니요</button>
        <button class="btn btn-primary" id="confirmYes">네</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
<script src="js/library.js"></script>
<script src="js/stats.js"></script>
<script src="js/calendar.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.getElementById('settingsBtn').addEventListener('click',()=>{
  document.getElementById('settingsName').value=appSettings.libraryName||'나의 서재';
  document.getElementById('settingsGoal').value=appSettings.yearlyGoal||30;
  openModal('ov-settings');
});
document.getElementById('settingsSave').addEventListener('click',()=>{
  const name=document.getElementById('settingsName').value.trim();
  const goal=parseInt(document.getElementById('settingsGoal').value)||30;
  if(name) appSettings.libraryName=name;
  appSettings.yearlyGoal=Math.max(1,Math.min(999,goal));
  document.querySelector('.nb-title').textContent=appSettings.libraryName;
  saveData();
  closeModal('ov-settings');
  showToast('설정을 저장했어요');
});
document.getElementById('exportImportBtn').addEventListener('click',()=>openModal('ov-export'));
if(appSettings.libraryName) document.querySelector('.nb-title').textContent=appSettings.libraryName;
</script>
</body>
</html>
